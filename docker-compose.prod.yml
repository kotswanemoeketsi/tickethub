# Production overrides for one Ubuntu server, used by scripts/deploy-ubuntu.sh:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Docker publishes ports straight through the firewall, so nothing here listens on a
# public address by default. Caddy on the host serves HTTPS and forwards to the app on
# 127.0.0.1. Without a domain, WEB_BIND=0.0.0.0 publishes the app on http://<ip>:<WEB_PORT>.
# MySQL is not published at all; Mailpit is reachable through an SSH tunnel only
# (ssh -L 8025:127.0.0.1:8025 you@server, then http://localhost:8025).
# Needs Docker Compose 2.24 or later for !override and !reset.

services:
  mysql:
    ports: !reset []

  mailpit:
    ports: !override
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"

  app:
    ports: !override
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8000}:8080"
    logging: &logging
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  worker:
    logging: *logging

  migrate:
    logging: *logging
